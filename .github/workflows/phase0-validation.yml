name: Phase 0 validation

on:
  push:
    branches:
      - phase0-freeze-contracts

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
        continue-on-error: true
      - run: npm run build
