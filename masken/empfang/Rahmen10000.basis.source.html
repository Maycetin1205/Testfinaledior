      /* Anchor for the lookup window in the editor, which covers the whole block. */
      :host { position: relative; }

      /* The capture row sticks to the bottom with paging too: otherwise the
         operator would type out of sight. */
      .body > .row.capture {
        position: sticky;
        bottom: 0;
        z-index: 1;
      }

      /* The capture row stands apart from the booked rows: a firm line above
         it, the light ground of a field. */
      .row.capture {
        flex: none;
        background: var(--se-panel-2);
        border-top: var(--se-border) solid var(--se-muted);
      }

      .row.captured { flex: none; }
      :host(:not([preview])) .row.captured { cursor: pointer; }

      /* Anchor for the cross. */
      .row { position: relative; }

      /* One sign per row state, the tone: the reception mask tones a table
         row on hover the same way and shows no dot inside a row. */
      .row[data-status="captured"],
      .row[data-status="writes"] { background: var(--se-accent-soft); }
      .row[data-status="changed"] { background: var(--se-warning-soft); }
      .row[data-status="error"] { background: var(--se-danger-soft); }
      .row[data-status="writes"] { animation: se-writing 1.1s ease-in-out infinite; }
      .row[data-status="written"] { color: var(--se-muted); }
      @keyframes se-writing { 50% { opacity: 0.55; } }
      @media (prefers-reduced-motion: reduce) {
        .row[data-status="writes"] { animation: none; }
      }

      /* Absolute, or the cross would push the value of the last cell aside. */
      .row-remove {
        position: absolute;
        right: 2px;
        top: 50%;
        transform: translateY(-50%);
        padding: 0 4px;
        font-family: var(--se-font);
        font-size: var(--se-fs-sm);
        line-height: 1;
        color: var(--se-faint);
        background: var(--se-panel);
        border: 0;
        border-radius: var(--se-radius);
        cursor: pointer;
        opacity: 0;
      }
      .row:hover .row-remove,
      .row-remove:focus { opacity: 1; }
      .row-remove:hover { color: var(--se-danger); background: var(--se-danger-soft); }

      /* The chosen row is tinted at most, never framed. */
      .body > .row.selected,
      .body > .row:focus,
      .body > .row.selected:focus:not(:focus-visible) { outline: none; }

      /* A typable cell hands its padding to its input, so the text keeps the
         edge of every other cell, and lets the suggestion list hang out. */
      .row > div.typable,
      .row.capture [role='cell'] {
        overflow: visible;
        padding: 0 calc(var(--se-cell-x) - var(--se-input-x) - var(--se-border));
      }
      .row:not(.subline) > div.typable,
      .row.capture:not(.subline) [role='cell'] {
        display: flex;
        align-items: center;
      }

  .wrap.empty input[type="time"]:not(:focus)::-webkit-datetime-edit { opacity: 0; }
  input[type="date"]:focus ~ .ph,
  input[type="time"]:focus ~ .ph { display: none; }

  .row {
    display: flex;
    align-items: center;
    gap: var(--se-gap);
    font-size: var(--se-fs);
    font-weight: 500;
    color: var(--se-ink);
  }
  input[type='checkbox'].ctrl {
    width: 16px;
    height: 16px;
    padding: 0;
    flex: none;
    accent-color: var(--se-accent);
  }

  .lookup { position: relative; }
  .field .lookup .ctrl { padding-right: 38px; }
  /* The label leaves the magnifier free: in the editor it takes clicks and
     would cover it. */
  .lookup ~ .ph { margin-right: calc(38px + var(--se-border)); }

  /* The open suggestion list hangs out of the field. Grid children stack in
     document order, so without this it would lie under the next block. */
  :host([data-ff-list]) { position: relative; z-index: 5; }

  .magnifier {
    position: absolute;
    top: var(--se-border);
    bottom: var(--se-border);
    right: var(--se-border);
    width: 30px;
    display: grid;
    place-items: center;
    padding: 0;
    border: none;
    background: none;
    color: var(--se-muted);
    cursor: pointer;
    transition: background var(--se-move);
  }
  .magnifier:hover { background: var(--se-accent-soft); color: var(--se-ink); }
  .magnifier:focus-visible { outline: 2px solid var(--se-accent); outline-offset: -2px; }

  /* The magnifier stays clickable in the editor: it opens the lookup window and
     its inspector section. The label takes the double click that renames it. */
  :host([preview]) .ctrl { pointer-events: none; }
  :host([preview]) .ph { pointer-events: auto; }
  :host([preview]) .wrap[data-ff-bound] .ctrl {
    border-style: dotted;
    border-color: var(--se-accent);
  }
  :host([preview]) .field.plain .wrap[data-ff-bound] .ctrl {
    border-color: transparent;
    border-bottom-color: var(--se-accent);
  }

  :host(:not([preview])) .row .text { cursor: pointer; user-select: none; }

  :host([fills]) .field,
  :host([fills]) .wrap,
  :host([fills]) .lookup { height: 100%; }
  :host([fills]) .wrap .ctrl { height: 100%; min-height: 0; }

  :host { min-width: 0; height: 100%; display: flex; flex-direction: column; }

  .board {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 15px;
    flex: 1;
    min-height: 0;
    overflow-x: auto;
    box-sizing: border-box;
  }

  .column {
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    flex: 1 1 0;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    background: var(--tone-shell);
    border: 1.5px solid var(--tone-line);
    border-radius: var(--se-radius);
    font-family: var(--se-font);
  }

  .head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 13px 15px;
    background: var(--tone-tint);
    border-bottom: var(--se-border) solid var(--tone-line);
  }

  .dot {
    flex: none;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--tone-strong);
  }

  .head-text {
    color: var(--tone-ink);
    font-size: var(--se-fs);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .count {
    margin-left: auto;
    min-width: 22px;
    padding: 1px 8px;
    border-radius: var(--se-radius);
    background: var(--se-panel);
    border: var(--se-border) solid var(--tone-line);
    text-align: center;
    font-family: var(--se-mono);
    font-size: var(--se-fs-sm);
    font-weight: 600;
    color: var(--tone-ink);
  }

  .body {
    padding: 11px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: var(--se-gap);
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
  }

  /* A place of a column with more than one: a box in the box. */
  .place {
    flex: none;
    border: 1.5px solid var(--tone-line);
    border-radius: var(--se-radius);
    background: var(--se-panel);
    overflow: hidden;
  }

  .place-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--tone-soft);
  }
  .place-head .head-text { font-size: var(--se-fs-sm); }

  .place-count {
    flex: none;
    margin-left: auto;
    font-family: var(--se-mono);
    font-size: var(--se-fs-sm);
    font-weight: 600;
    color: var(--tone-ink);
  }

  .place-body {
    display: flex;
    flex-direction: column;
    gap: var(--se-gap);
    padding: 10px;
  }

  /* Where a dragged card would land. */
  .column.target .body,
  .place.target .place-body {
    background: color-mix(in oklab, var(--tone-strong) 8%, transparent);
    outline: 2px dashed var(--tone-strong);
    outline-offset: -2px;
  }

  .card {
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: var(--se-gap-sm);
    padding: 8px;
    background: var(--se-card-bg);
    border: var(--se-border) solid var(--se-card-line);
    border-radius: var(--se-radius);
    font-family: var(--se-font);
    transition: border-color var(--se-move);
  }

  .card:hover { border-color: var(--se-card-hover); }

  .card.chosen {
    border-color: var(--se-accent);
    background: var(--se-accent-soft);
  }

  .card.dragging { opacity: 0.55; }

  /* The avatar beside name and subline, as .vkarte-haupt holds them. */
  .main {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    min-width: 0;
  }

  .ident {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--se-gap-sm);
  }

  .avatar {
    box-sizing: border-box;
    flex: none;
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: var(--se-radius);
    background: no-repeat center / cover;
    color: var(--se-animal-paw);

  .avatar svg { width: 88%; height: 88%; stroke-width: 2; }

  .name,
  .extra {
    display: block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .name {
    color: var(--se-ink);
    font-size: var(--se-fs-name);
    font-weight: 600;
    line-height: var(--se-lh-tight);
  }
  .extra {
    color: var(--se-muted);
    font-size: var(--se-fs-sm);
  }

  .text {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
    color: var(--se-ink);
    font-size: var(--se-fs);
    line-height: var(--se-lh);
  }

  .foot {
    display: flex;
    align-items: center;
    gap: var(--se-gap);
  }
  .foot-title {
    min-width: 0;
    color: var(--se-muted);
    font-size: var(--se-fs-sm);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .date,
  .time {
    flex: none;
    color: var(--se-faint);
    font-size: var(--se-fs-sm);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .chip {
    flex: none;
    margin-left: auto;
    padding: 2px 8px;
    border-radius: var(--se-radius);
    font-family: var(--se-font);
    font-size: var(--se-fs-chip);
    font-weight: 600;
    color: var(--tone-ink);
    background: var(--tone-soft);
    white-space: nowrap;
  }
