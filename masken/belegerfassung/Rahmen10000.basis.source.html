  --se-gap-lg: 12px;

/* The mask is the whole window, a white sheet to its edges; its grid as on the editor canvas */
html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--se-panel); }
.ff-root { box-sizing: border-box; width: 100%; height: 100%; overflow: auto; background: var(--se-panel); font-family: var(--se-font); font-size: var(--se-fs); line-height: var(--se-lh); color: var(--se-ink); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; caret-color: var(--se-accent); scrollbar-width: thin; scrollbar-color: var(--se-scrollbar) transparent; display:grid;grid-template-columns:repeat(48, 1fr);grid-auto-rows:12px;gap:4px;align-content:start; grid-template-rows: repeat(14, 12px) repeat(32, minmax(0, 1fr)) repeat(15, 12px); padding: var(--se-sheet-top) var(--se-sheet-x) var(--se-sheet-bottom); }
.ff-root * { font-family: inherit; font-size: inherit; }
.ff-root ::selection { background: var(--se-selection-ground); color: var(--se-ink); }

  .field {
    position: relative;
    box-sizing: border-box;
    height: ${a(kt(2))}px;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-rows: 20px;
    align-content: center;
    padding: 0 10px;
    border-radius: var(--se-radius);
    font-family: var(--se-font);
    cursor: text;
    transition: background-color var(--se-move), box-shadow var(--se-move);
  }
  .field.labelled {
    height: ${a(kt(3))}px;
    grid-template-rows: 14px 20px;
    row-gap: 1px;
    align-content: start;
    padding-top: 6px;
  }
  .field:hover { background: var(--se-hover); }
  .field:focus-within {
    background: var(--se-panel);
    box-shadow: var(--se-focus-ring);
  }

  /* The label as a Rubrik: small capitals, spaced, light. */
  .label {
    grid-column: 2;
    grid-row: 1;
    min-width: 0;
    color: var(--se-label);
    font-size: var(--se-fs-rubric);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: var(--se-tracking-caps);
    line-height: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .field:focus-within .label { color: var(--se-accent-dark); }

  /* The value, its control and the dash of an empty field on one line. */
  .value {
    grid-column: 2;
    grid-row: -2;
    display: grid;
    grid-template: 20px / minmax(0, 1fr);
    align-items: center;
    min-width: 0;
  }
  .value > * { grid-area: 1 / 1; }

  /* Art Linie: a hairline under the value, as under a signature, so the eye
     finds where to type; blue while typing. */
  .field.line .value { box-shadow: var(--se-field-line); }
  .field.line:focus-within .value { box-shadow: var(--se-field-line-typing); }

  /* .f .v */
  .ctrl,
  .shown {
    box-sizing: border-box;
    width: 100%;
    min-width: 0;
    height: 20px;
    margin: 0;
    padding: 0;
    border: 0;
    outline: none;
    background: transparent;
    color: var(--se-ink);
    font-family: var(--se-font);
    font-size: var(--se-fs-lg);
    font-weight: 600;
    line-height: 20px;
    font-variant-numeric: tabular-nums;
    text-overflow: ellipsis;
  }
  .shown {
    display: block;
    white-space: nowrap;
    overflow: hidden;
  }

  /* .f .v.empty::before */
  .dash {
    color: var(--se-empty);
    font-size: var(--se-fs-lg);
    font-weight: 600;
    line-height: 20px;
    pointer-events: none;
  }
  .field:focus-within .dash { visibility: hidden; }

  /* The chosen symbol on the left, beside label and value. */
  .symbol {
    grid-column: 1;
    grid-row: 1 / -1;
    align-self: center;
    display: grid;
    margin-right: 10px;
    color: var(--se-faint);
  }
  .symbol .icon { width: 18px; height: 18px; }

  /* How the field is filled in, on the right; a click goes through to the
     control below. */
  .sign {
    grid-column: 3;
    grid-row: 1 / -1;
    align-self: center;
    display: grid;
    margin-left: 8px;
    color: var(--se-faint);
    pointer-events: none;
  }
  .sign .icon { width: 16px; height: 16px; }

  /* A select lies invisible over the whole field. */
  select.ctrl {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
    appearance: none;
  }

  input[type='number'] { appearance: textfield; }
  input[type='number']::-webkit-inner-spin-button,
  input[type='number']::-webkit-outer-spin-button { appearance: none; margin: 0; }

  /* The browser's own picker of a date or a time lies invisible over the sign
     on the right; the rest of the field takes the typing. */
  input::-webkit-datetime-edit,
  input::-webkit-datetime-edit-fields-wrapper,
  input::-webkit-datetime-edit-text,
  input::-webkit-datetime-edit-day-field,
  input::-webkit-datetime-edit-month-field,
  input::-webkit-datetime-edit-year-field,
  input::-webkit-datetime-edit-hour-field,
  input::-webkit-datetime-edit-minute-field { padding: 0; }
  input::-webkit-calendar-picker-indicator {
    position: absolute;
    top: 0;
    right: 0;
    width: 40px;
    height: 100%;
    margin: 0;
    padding: 0;
    opacity: 0;
    cursor: pointer;
  }

  /* An empty date stays empty instead of showing the browser's date pattern;
     while it is typed into, the pattern stands instead of the dash. */
  .value.empty input[type='date']:not(:focus)::-webkit-datetime-edit,
  .value.empty input[type='time']:not(:focus)::-webkit-datetime-edit { opacity: 0; }

  /* The lookup: its magnifier is a button on the right, its hits hang under
     the whole field. */
  .field.lookup { padding-right: 40px; }
  .field .lookup { position: static; min-width: 0; }
  :host([data-ff-list]) { position: relative; z-index: 5; }

  .magnifier {
    position: absolute;
    top: 50%;
    right: 5px;
    width: 30px;
    height: 30px;
    transform: translateY(-50%);
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    border-radius: var(--se-radius-sm);
    background: none;
    color: var(--se-faint);
    cursor: pointer;
    transition: background-color var(--se-move), color var(--se-move);
  }
  .magnifier:hover { background: var(--se-hover-strong); color: var(--se-ink); }
  .magnifier:focus-visible { outline: none; box-shadow: var(--se-focus-ring); }
  .magnifier svg { width: 16px; height: 16px; }

  /* The checkbox: .f.check, the box (tickBoxStyle) and its text in the
     middle of the field. */
  .field.check {
    display: flex;
    align-items: center;
    padding: 0 10px;
    cursor: default;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .text {
    min-width: 0;
    color: var(--se-ink);
    font-size: var(--se-fs-lg);
    font-weight: 600;
    line-height: 20px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  :host(:not([preview])) .text { cursor: pointer; user-select: none; }

  /* In the editor the controls take no clicks; the magnifier still opens the
     lookup window, the label takes the double click that renames it. */
  :host([preview]) .field { cursor: default; }
  :host([preview]) .ctrl { pointer-events: none; }

  :host { min-width: 0; height: 100%; display: flex; flex-direction: column; }

  .board {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    gap: 12px;
    flex: 1;
    min-height: 0;
    overflow-x: auto;
    box-sizing: border-box;
  }

  .column {
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    flex: 1 1 0;
    min-width: 232px;
    min-height: 0;
    overflow: hidden;
    background: var(--tone-shell);
    border-radius: var(--se-radius-card);
    box-shadow: var(--se-column-edge);
    font-family: var(--se-font);
  }

  .head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    height: 48px;
    padding: 0 16px;
  }

  .dot {
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--tone-strong);
  }

  .head-text {
    color: var(--se-ink);
    font-size: var(--se-fs-lg);
    font-weight: 700;
    letter-spacing: -.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* .card .hd .cnt: the count as grey text. */
  .count {
    color: var(--se-muted);
    font-size: var(--se-fs-lg);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .body {
    padding: 0 10px 10px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: thin;
  }

  /* A place of a column with more than one: a room on the column, white,
     its name small above the cards. The places share the height of the
     column: each keeps its cards and takes an equal part of what is left, so
     an empty room is a room, not a strip. */
  .place {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
    border-radius: var(--se-radius);
    background: var(--se-place-ground);
    overflow: hidden;
  }

  .place-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px 4px;
  }
  .place-head .head-text {
    color: var(--se-muted);
    font-size: var(--se-fs-sm);
  }

  .place-count {
    flex: none;
    margin-left: auto;
    color: var(--se-muted);
    font-size: var(--se-fs-sm);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .place-body {
    display: flex;
    flex-direction: column;
    flex: 1 1 auto;
    min-height: 0;
    gap: 8px;
    padding: 4px 8px 8px;
    overflow-y: auto;
    scrollbar-width: thin;
  }

  /* Where a dragged card would land. */
  .column.target .body,
  .place.target .place-body {
    background: color-mix(in oklab, var(--tone-strong) 8%, transparent);
    outline: 2px dashed var(--tone-strong);
    outline-offset: -2px;
  }

  .card {
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    background: var(--se-card-bg);
    border-radius: var(--se-radius);
    box-shadow: var(--se-shadow-tile);
    font-family: var(--se-font);
    transition: box-shadow var(--se-move), background-color var(--se-move);
  }

  /* As a row of every list: a ground under the pointer, chosen soft blue
     with the accent bar at the left edge. */
  .card:hover {
    background: var(--se-row-hover);
    box-shadow: var(--se-shadow-tile-hover);
  }

  .card.chosen {
    background: var(--se-selection);
    box-shadow: var(--se-shadow-chosen);
  }

  .card.dragging { opacity: 0.55; }

  /* The avatar beside name and subline. */
  .main {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    min-width: 0;
  }

  .ident {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  /* Name and subline on one line. */
  .line {
    display: flex;
    align-items: baseline;
    gap: 8px;
    min-width: 0;
  }

  .name,
  .owner {
    display: block;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .name {
    color: var(--se-ink);
    font-size: var(--se-fs-lg);
    font-weight: 700;
  }
  .meta {
    flex: none;
    color: var(--se-muted);
    font-size: var(--se-fs-sm);
    font-weight: 600;
    white-space: nowrap;
  }
  .owner {
    color: var(--se-muted);
    font-size: var(--se-fs-sm);
    font-weight: 600;
  }

  .time {
    flex: none;
    color: var(--se-ink-2);
    font-size: var(--se-fs-sm);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* The flags of the card. */
  .flags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .text {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
    color: var(--se-ink-2);
    font-size: var(--se-fs);
    font-weight: 600;
    line-height: var(--se-lh);
  }

  /* The line of information under the text. */
  .date {
    color: var(--se-muted);
    font-size: var(--se-fs-sm);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* How far the time lies from now; past it, red. */
  .until {
    color: var(--se-muted);
    font-size: var(--se-fs-sm);
    font-weight: 600;
    white-space: nowrap;
  }
  .until.late { color: var(--se-danger); }

  /* The line before each hour of a column by the clock. */
  .hour {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 4px 0;
    color: var(--se-muted);
    font-family: var(--se-font);
    font-size: var(--se-fs-xs);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .hour::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--se-line);
  }

  /* The line of now. */
  .now {
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 1px 4px;
    color: var(--se-danger);
    font-family: var(--se-font);
    font-size: var(--se-fs-xs);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .now::before {
    content: '';
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--se-danger);
  }
  .now::after {
    content: '';
    flex: 1;
    height: 2px;
    background: var(--se-danger);
  }

  /* The button under the card, a soft button (.btn.sec) in the tone of the
     column it leads to. */
  .advance {
    box-sizing: border-box;
    width: 100%;
    height: 32px;
    border: none;
    border-radius: var(--se-radius);
    background: var(--tone-tint);
    color: var(--tone-ink);
    font-family: var(--se-font);
    font-size: var(--se-fs);
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    transition: background-color var(--se-move);
  }
  .advance:hover { background: color-mix(in oklab, var(--tone-tint), var(--tone-strong) 10%); }
  .advance:focus-visible { outline: none; box-shadow: var(--se-focus-ring); }

  /* The action of the last column: the blue of the mask. */
  .advance.action {
    --tone-tint: var(--se-accent-soft);
    --tone-ink: var(--se-accent-dark);
    --tone-strong: var(--se-accent);
  }

  :host([preview]) [data-ff-spot]:not([data-ff-bound]):not(.avatar):empty::before,
  :host([preview]) .advance:empty::before {
    content: '\u2014';
    color: var(--se-faint);
  }
